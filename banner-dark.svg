  <text x="44" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="#F0EDE6" font-weight="700" letter-spacing="-0.5">Hi, I'm Jason.</text>
