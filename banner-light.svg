<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="100%">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#E6DFD1" stroke-width="0.7" opacity="0.65"/>
    </pattern>
  </defs>
  <rect width="880" height="180" rx="12" fill="#FBF8F1" stroke="#E2D9C5" stroke-width="1.5"/>
  <rect width="880" height="180" rx="12" fill="url(#grid)"/>
  <!-- Subtle accent bar -->
  <rect x="44" y="38" width="36" height="3" rx="1.5" fill="#9B3B24"/>
  <text x="90" y="43" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#9B3B24" letter-spacing="3" font-weight="600">BUILDER LOG · BEIJING</text>
  <text x="44" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="#2C261E" font-weight="700" letter-spacing="-0.5">Hi, I'm Jason.</text>
  <text x="44" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#5C5346">I build agentic workflows, interactive 3D web worlds, and design-driven AI tools.</text>
  <text x="44" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#8A7E6A">"Specs over vibes. Verification gates over self-reports."</text>
  <!-- Minimalist geometric compass/paper-plane motif on the right -->
  <g transform="translate(740, 48)" opacity="0.85">
    <circle cx="42" cy="42" r="38" fill="none" stroke="#D9CFB8" stroke-width="1.2" stroke-dasharray="4 4"/>
    <circle cx="42" cy="42" r="26" fill="none" stroke="#E2D9C5" stroke-width="1"/>
    <path d="M22 46 L64 26 L46 64 L39 48 Z" fill="none" stroke="#9B3B24" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M64 26 L39 48" stroke="#9B3B24" stroke-width="1.2"/>
  </g>
</svg>
